[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurf"
version = "0.1.0"
description = "SPX implied volatility surface: SVI/SSVI fits and static arbitrage detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
dev = ["pytest>=7", "ruff>=0.4", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B905"]
